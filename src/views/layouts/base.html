<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />

    <title>{% block title %}QA Forum{% endblock %}</title>

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="QA Forum Startseite">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M8.5 18.5 4 21v-5.2A8 8 0 1 1 8.5 18.5Z" />
              <path d="M8 11h.01M12 11h.01M16 11h.01" />
            </svg>
          </span>
          <span>QA Forum</span>
        </a>

        <nav class="sidebar__nav" aria-label="Hauptnavigation">
          <a class="sidebar__link sidebar__link--active" href="/">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m3 10 9-7 9 7" />
              <path d="M5 9v11h14V9M9 20v-6h6v6" />
            </svg>
            <span>Aktuelle Fragen</span>
          </a>
          <a class="sidebar__link" href="/">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path
                d="M9.5 9a2.7 2.7 0 0 1 5.1 1.2c0 1.8-2.6 2.1-2.6 4M12 17.5h.01"
              />
            </svg>
            <span>Meine Fragen</span>
          </a>
          <a class="sidebar__link" href="/new">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            <span>Frage stellen</span>
          </a>
          <a class="sidebar__link" href="#lesezeichen">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 4.8A1.8 1.8 0 0 1 7.8 3h8.4A1.8 1.8 0 0 1 18 4.8V21l-6-4-6 4Z"
              />
            </svg>
            <span>Lesezeichen</span>
          </a>
          <a class="sidebar__link" href="#profil">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" />
              <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
            </svg>
            <span>Mein Profil</span>
          </a>
        </nav>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <form class="search" role="search" action="/" method="get">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-4-4" />
            </svg>
            <input
              type="search"
              name="q"
              aria-label="Fragen durchsuchen"
              placeholder="Fragen suchen..."
            />
            <kbd>Ctrl K</kbd>
          </form>

          <!-- <button
            class="profile-menu"
            type="button"
            aria-label="Profilmenü öffnen"
          >
            <span class="avatar avatar--profile">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="3.5" />
                <path d="M5.5 20a6.5 6.5 0 0 1 13 0" />
              </svg>
            </span>
            <svg
              class="profile-menu__chevron"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="m8 10 4 4 4-4" />
            </svg>
          </button> -->
        </header>

        <main>{% block content %}{% endblock %}</main>
        <footer class="site-footer">© 2026 QA Forum.</footer>
      </div>
    </div>
    <script src="/index.js" defer></script>
  </body>
</html>
