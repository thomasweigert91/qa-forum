{% extends "layouts/base.html" %} {% block title %}Konto erstellen | QA Forum{%
endblock %} {% block content %}
<section class="auth-page">
  <div class="auth-page__header">
    <p class="question-overview__eyebrow">Neu im QA Forum?</p>
    <h1>Konto erstellen</h1>
    <p>Erstelle dein Konto und teile dein Wissen mit der Community.</p>
  </div>

  <form class="question-form auth-form" action="/signup" method="post">
    <label for="username">
      <span>Benutzername</span>
    </label>
    <input
      id="username"
      name="username"
      type="text"
      autocomplete="username"
      placeholder="Dein Benutzername"
      required
    />

    <label for="email">
      <span>E-Mail-Adresse</span>
    </label>
    <input
      id="email"
      name="email"
      type="email"
      autocomplete="email"
      placeholder="du@beispiel.de"
      required
    />

    <label for="password">
      <span>Passwort</span>
    </label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="new-password"
      placeholder="Dein Passwort"
      required
    />

    <label for="passwordConfirmation">
      <span>Passwort wiederholen</span>
    </label>
    <input
      id="passwordConfirmation"
      name="passwordConfirmation"
      type="password"
      autocomplete="new-password"
      placeholder="Dein Passwort wiederholen"
      required
    />

    <div class="question-form__actions">
      <a class="secondary-button" href="/">Abbrechen</a>
      <button class="primary-button" type="submit">Konto erstellen</button>
    </div>
  </form>

  <p class="auth-page__switch">
    Du hast bereits ein Konto? <a href="/login">Jetzt einloggen</a>
  </p>
</section>
{% endblock %}
