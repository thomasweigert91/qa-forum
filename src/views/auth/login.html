{% extends "layouts/base.html" %} {% block title %}Login | QA Forum{% endblock
%} {% block content %}
<section class="auth-page">
  <div class="auth-page__header">
    <p class="question-overview__eyebrow">Willkommen zurück</p>
    <h1>Einloggen</h1>
    <p>Melde dich an, um Fragen zu stellen und Antworten zu schreiben.</p>
  </div>

  {% if error %}
  <p class="form-error" role="alert">{{ error }}</p>
  {% endif %}

  <form class="question-form auth-form" action="/login" method="post">
    <label for="email">
      <span>E-Mail-Adresse</span>
    </label>
    <input
      id="email"
      name="email"
      type="email"
      autocomplete="email"
      placeholder="du@beispiel.de"
      required
    />

    <label for="password">
      <span>Passwort</span>
    </label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      placeholder="Dein Passwort"
      required
    />

    <div class="question-form__actions">
      <a class="secondary-button" href="/">Abbrechen</a>
      <a class="secondary-button" href="/signup">Konto erstellen</a>
      <button class="primary-button" type="submit">Einloggen</button>
    </div>
  </form>
</section>
{% endblock %}
